version: '3.9'

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: salesplatform_system
      MYSQL_USER: sp_admin
      MYSQL_PASSWORD: ChangeMe_Strong!
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: sp_admin
      DB_PASSWORD: ChangeMe_Strong!
      DB_NAME: salesplatform_system
      JWT_SECRET: change_me_to_a_real_256bit_secret
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '80:80'
    environment:
      VITE_API_BASE_URL: http://backend:8080
    depends_on:
      - backend

volumes:
  mysql_data:
